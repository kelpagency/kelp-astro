[build]
command = "npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "22.12.0"

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
Referrer-Policy = "strict-origin-when-cross-origin"
Cross-Origin-Opener-Policy = "same-origin"
Cross-Origin-Resource-Policy = "cross-origin"
Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), fullscreen=(self \"https://www.youtube-nocookie.com\" \"https://www.youtube.com\" \"https://player.vimeo.com\")"

[[headers]]
for = "/_astro/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/fonts/*"
[headers.values]
Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
for = "/videos/*"
[headers.values]
Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
for = "/images/*"
[headers.values]
Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
for = "/animations/*"
[headers.values]
Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
